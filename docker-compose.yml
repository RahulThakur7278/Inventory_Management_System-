version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: inventory-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - inventory-network

  # Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: inventory-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://surya727859_db_user:655TZTdfKII288YN@cluster0.yahm9jr.mongodb.net/inventory_db?appName=Cluster0
      - JWT_SECRET=inventory_mgmt_super_secret_key_2024_x7k9m2
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=production
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/uploads
    networks:
      - inventory-network

  # Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: inventory-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - inventory-network

volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local

networks:
  inventory-network:
    driver: bridge
